# Slacky-Update base hardening (6A-28): the kernel refuses to follow links and open files that another user planted in
# shared folders such as /tmp. Default on Arch, Fedora and Ubuntu (set by systemd); Slackware keeps the kernel default 0.
# Turn off with: slacky-update --protect-links off   (a file you changed is kept on upgrades)
fs.protected_symlinks = 1
fs.protected_hardlinks = 1
fs.protected_regular = 2
fs.protected_fifos = 1
